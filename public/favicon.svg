<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="hextorqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagon Frame -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" stroke="url(#hextorqGrad)" stroke-width="6" stroke-linejoin="round" fill="#090E17" />
  
  <!-- Inner Torque / Tech Blades -->
  <path d="M50 22 L72 35 L72 65 L50 78 L28 65 L28 35 Z" fill="none" stroke="url(#hextorqGrad)" stroke-width="2.5" stroke-dasharray="6 3" opacity="0.6"/>
  
  <!-- Central Pulse Core / Server Node -->
  <circle cx="50" cy="50" r="14" fill="url(#coreGrad)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="6" fill="#FFFFFF" />
  
  <!-- Infrastructure Connection Rays -->
  <line x1="50" y1="22" x2="50" y2="36" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <line x1="72" y1="65" x2="60" y2="58" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <line x1="28" y1="65" x2="40" y2="58" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
</svg>
